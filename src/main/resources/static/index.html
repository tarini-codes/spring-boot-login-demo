<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register Page</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:hover { background-color: #45a049; }
        .register-btn { background-color: #008CBA; }

        #message { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login Form</h2>
        <label for="username"></label><input type="text" id="username" placeholder="Enter Username" required>
        <label for="password"></label><input type="password" id="password" placeholder="Enter Password" required>
        <button onclick="loginUser()">Login</button>
        <button class="register-btn" onclick="registerUser()">Register</button>
        <p id="message"></p>
    </div>

    <script>
        async function loginUser() {
            const user = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });

            document.getElementById('message').innerText = await response.text();
        }

        async function registerUser() {
            const user = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });

            document.getElementById('message').innerText = await response.text();
        }
    </script>
</body>
</html>
